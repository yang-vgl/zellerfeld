services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html/backend
    volumes:
      - ./:/var/www/html
    ports:
      - "9002:9000"

  web:
    image: nginx:1.25-alpine
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
