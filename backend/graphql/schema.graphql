"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Root queries for the micro-blog API."
type Query {
    "Fetch a user by username, including their profile info and posts."
    userProfile(
        username: String! @eq
    ): User @find(model: "App\\Models\\User")

    "Global feed of posts across the platform (paginated)."
    globalFeed: [Post!]! @paginate(
        type: "PAGINATOR",
        defaultCount: 10,
        builder: "App\\GraphQL\\Queries\\PostQuery@resolveGlobalFeed"
    )
}

"Mutations for creating and updating resources."
type Mutation {
    "Create a new micro-blog post for a user."
    createPost(
        userId: ID! @rename(attribute: "user_id")
        body: String!
    ): Post @create(model: "App\\Models\\Post") @validator
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Display name."
    name: String!

    "Unique username used in profile URLs."
    username: String!

    "Unique email address."
    email: String!

    "Posts authored by this user."
    posts: [Post!]! @hasMany

    "When the email was verified."
    emailVerifiedAt: DateTime @rename(attribute: "email_verified_at")

    "When the account was created."
    createdAt: DateTime! @rename(attribute: "created_at")

    "When the account was last updated."
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

"A short micro-blog post."
type Post {
    "Unique primary key."
    id: ID!

    "The textual content of the post (max 280 characters)."
    body: String!

    "The author of this post."
    user: User! @belongsTo

    "When the post was created."
    createdAt: DateTime! @rename(attribute: "created_at")

    "When the post was last updated."
    updatedAt: DateTime! @rename(attribute: "updated_at")
}
